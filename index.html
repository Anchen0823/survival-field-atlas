<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="color-scheme" content="light"><title>方块纪行 · 生存统计图鉴</title>
<style>
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;color:#26372e;background:#f5f2e9;font:15px/1.55 "Segoe UI","Microsoft YaHei",sans-serif}header{background:#213d32;color:#fff}.wrap{max-width:1170px;margin:auto;padding:0 30px}.nav{height:66px;display:flex;align-items:center;gap:14px}.logo{display:grid;place-items:center;width:32px;height:32px;border:2px solid #c3d7a9;color:#c3d7a9;font-size:21px}.brand{font-weight:750;letter-spacing:.12em}.nav small{color:#bfcfbe;font:12px monospace;letter-spacing:.13em}.nav button{margin-left:auto;background:#e1e9d5;color:#243e30}.hero{position:relative;isolation:isolate;overflow:hidden;background:#d8e1c8;min-height:260px;border-bottom:1px solid #a9b6a0}.hero canvas{position:absolute;inset:0;width:100%;height:100%;z-index:-1;image-rendering:pixelated}.hero .wrap{padding-top:49px;padding-bottom:60px}.eyebrow{font:bold 12px monospace;letter-spacing:.16em;color:#43604c}.hero h1{margin:10px 0 4px;font:700 clamp(40px,5.6vw,72px)/1.15 Georgia,"Songti SC",SimSun,serif;letter-spacing:.06em}.hero p{margin:8px 0;color:#394d3b}.metrics{display:grid;grid-template-columns:repeat(4,1fr);margin:24px 0;gap:12px}.metric,.panel{border:1px solid #d0d2c3;background:#fffdf6;border-radius:5px}.metric{padding:19px 21px;border-top:3px solid var(--accent,#517553)}.metric span,.muted{color:#637065;font-size:13px}.metric strong{display:block;font:600 clamp(27px,3vw,40px)/1.2 Georgia,serif;margin-top:8px;font-variant-numeric:tabular-nums}.metric small{font:13px "Segoe UI",sans-serif;margin-left:6px;color:#697466}.grid{display:grid;grid-template-columns:1.15fr 1fr;gap:18px}.panel{padding:22px 24px;min-width:0;margin-bottom:18px}.top{display:flex;align-items:baseline;justify-content:space-between;gap:16px;flex-wrap:wrap}h2{font-size:21px;letter-spacing:.04em;margin:0 0 13px}button,select,input{font:inherit}button,select{border:1px solid #bbc3b1;border-radius:4px;padding:6px 12px;background:#f1f3e9;color:#304c37;cursor:pointer}.rank{display:grid;grid-template-columns:1fr auto;gap:3px 10px;margin:10px 0}.num{font:14px monospace}.track{height:6px;background:#eeeee3;grid-column:1/-1}.bar{height:100%;background:#658364}.travel .bar{background:#af7745}.sectionhead{display:flex;align-items:center;gap:13px}.sectionhead:after{content:"";height:1px;background:#d1d0c4;flex:1}.search{width:min(100%,240px);padding:7px 11px;border:1px solid #bdc4b5;background:#fffef8;border-radius:3px}table{border-collapse:collapse;width:100%;margin-top:10px}td,th{padding:8px 4px;border-bottom:1px solid #e1e1d5;text-align:left}th{color:#617262;font-size:12px}td:last-child,th:last-child{text-align:right}.page{display:flex;align-items:center;justify-content:flex-end;gap:10px;margin-top:14px}button:disabled{opacity:.4;cursor:default}.timeline{display:grid;grid-template-columns:repeat(auto-fit,minmax(205px,1fr));gap:9px}.event{border-left:3px solid #ac8754;background:#f5f2e8;padding:8px 12px}.event small{display:block;color:#6b7469}.empty{color:#727a6e;padding:18px 0}.status{font-size:13px;color:#485c49}.status:empty{display:none}footer{padding:14px 0 32px;color:#657263;font-size:12px}button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid #bc772f} @media(max-width:720px){.wrap{padding:0 15px}.nav small{display:none}.metrics{grid-template-columns:1fr 1fr}.grid{display:block}.hero{min-height:210px}.hero .wrap{padding-top:35px}.panel{padding:16px}.metric{padding:13px}.hero p{background:#e6e9d7d9;width:fit-content;padding:2px 5px}.nav{height:55px}}
</style></head><body>
<header><div class="wrap nav"><span class="logo" aria-hidden="true">▧</span><span class="brand">方块纪行</span><small>SURVIVAL FIELD ATLAS</small><button id="importBtn">导入本地 JSON</button><input id="files" hidden type="file" accept=".json,application/json" multiple></div></header>
<section class="hero"><canvas id="land" aria-hidden="true"></canvas><div class="wrap"><div class="eyebrow">MINECRAFT JAVA EDITION</div><h1>生存统计图鉴</h1><p id="subtitle">选择玩家统计文件，绘制你的生存记录。</p></div></section>
<main class="wrap"><p class="status" id="status" role="status"></p><div class="metrics" id="metrics"></div>
<div class="grid"><section class="panel"><div class="top"><h2>物资与战斗排行</h2><select id="category" aria-label="排行类别"></select></div><div id="ranking"></div></section><section class="panel travel"><div class="top"><h2>移动足迹</h2><span class="muted">按移动方式 · 千米</span></div><div id="travel"></div></section></div>
<section class="panel"><div class="top"><h2>统计明细</h2><input class="search" type="search" id="search" placeholder="搜索名称、类别或英文 ID" aria-label="搜索统计"></div><table><thead><tr><th>类别</th><th>项目</th><th>累计</th></tr></thead><tbody id="details"></tbody></table><div class="page"><span id="pages" class="muted"></span><button id="prev" aria-label="上一页">上一页</button><button id="next" aria-label="下一页">下一页</button></div></section>
<section class="panel"><div class="top"><h2>进度足迹</h2><span id="count" class="muted"></span></div><div id="events" class="timeline"></div></section>
<footer>可同时选择存档中 stats 与 advancements 目录下的玩家 JSON。文件只在当前浏览器中读取。</footer></main>
<script id="snapshot" type="application/json">null</script><script>
'use strict';
const $=id=>document.getElementById(id), node=(tag,txt,cls)=>{const el=document.createElement(tag);if(txt!=null)el.textContent=txt;if(cls)el.className=cls;return el};
const cats={mined:'开采',crafted:'制作',picked_up:'拾取',used:'使用',killed:'击败',broken:'损坏',dropped:'丢弃',killed_by:'死于',custom:'综合'};
const moves={walk_one_cm:'步行',sprint_one_cm:'疾跑',fly_one_cm:'空中移动',fall_one_cm:'下落',crouch_one_cm:'潜行',climb_one_cm:'攀爬',swim_one_cm:'游泳',boat_one_cm:'乘船',minecart_one_cm:'矿车',walk_under_water_one_cm:'水下步行',walk_on_water_one_cm:'涉水',aviate_one_cm:'鞘翅滑翔',horse_one_cm:'骑马',strider_one_cm:'骑炽足兽'};
const fmt=n=>n.toLocaleString('zh-CN',{maximumFractionDigits:2}),short=id=>id.replace(/^minecraft:/,''), nice=id=>data.labels?.[id]||moves[short(id)]||short(id).replaceAll('_',' ');
let data=JSON.parse($('snapshot').textContent)||{},page=0;
function landscape(){const c=$('land'),w=c.width=640,h=c.height=140,g=c.getContext('2d');g.fillStyle='#e3e8d5';g.fillRect(0,0,w,h);g.fillStyle='#f4d99e';g.fillRect(475,19,22,22);for(let layer=0;layer<3;layer++){g.fillStyle=['#c8d5bd','#9fb79c','#72947d'][layer];for(let x=0;x<w;x+=4){const peak=Math.sin(x*.016+layer)*12+Math.cos(x*.043+layer*2)*7;const y=115-layer*-9-(x/w)**1.7*(56-layer*7)+peak;g.fillRect(x,Math.round(y/3)*3,4,h)}}for(let i=0;i<52;i++){let x=360+((i*83)%300),y=116+Math.sin(x*.024)*8+(i%3)*5,sz=3+i%4;g.fillStyle=i%2?'#547866':'#426657';for(let j=0;j<4;j++)g.fillRect(x-j*2,y-sz*4+j*sz,2+j*4,sz+1);g.fillRect(x,y-2,2,6)}}landscape();
for(const [key,label] of Object.entries(cats))if(key!=='custom')$('category').add(new Option(label,key));
function empty(el,t){el.append(node('div',t,'empty'))}
function bars(el,items,km=false){el.replaceChildren();if(!items.length){empty(el,'尚无统计记录');return}for(const [id,v] of items){let row=node('div',null,'rank'),track=node('div',null,'track'),bar=node('div',null,'bar');bar.style.width=(100*v/items[0][1])+'%';track.append(bar);row.append(node('span',nice(id)),node('span',fmt(km?v/100000:v),'num'),track);el.append(row)}}
const stats=()=>data.stats||{},entries=k=>Object.entries(stats()['minecraft:'+k]||{}).sort((a,b)=>b[1]-a[1]);
function render(){const c=stats()['minecraft:custom']||{},cs=k=>c['minecraft:'+k]||0,ready=Object.keys(stats()).length>0;
$('subtitle').textContent=data.title|| (ready?'当前导入的玩家统计':'选择玩家统计文件，绘制你的生存记录。');
$('metrics').replaceChildren();for(const [title,value,unit,color] of [['游玩时长',fmt(cs('play_time')/72000),'小时','#63865d'],['累计开采',fmt(entries('mined').reduce((n,a)=>n+a[1],0)),'方块','#9c8258'],['生物击杀',fmt(cs('mob_kills')),'次','#a96754'],['打开箱子',fmt(cs('open_chest')),'次','#63888a']]){let card=node('div',null,'metric'),v=node('strong',ready?value:'—');card.style.setProperty('--accent',color);v.append(node('small',unit));card.append(node('span',title),v);$('metrics').append(card)}
bars($('ranking'),entries($('category').value).slice(0,6));bars($('travel'),entries('custom').filter(([k])=>k.endsWith('_one_cm')).slice(0,6),true);drawTable();
const adv=Object.entries(data.advancements||{}).filter(([id,a])=>a?.done&&!id.includes(':recipes/')).map(([id,a])=>[id,Object.values(a.criteria||{}).sort().at(-1)||'']).sort((a,b)=>b[1].localeCompare(a[1]));$('events').replaceChildren();$('count').textContent=adv.length?'已完成 '+adv.length+' 项 · 按解锁时间倒序':'';if(!adv.length)empty($('events'),'导入进度文件后可查看已完成的进度。');for(const [id,date] of adv){let el=node('div',null,'event');el.append(node('small',date.slice(0,16)),node('strong',nice(id)));$('events').append(el)}}
function amount(cat,id,n){if(cat!=='custom')return fmt(n);if(id.endsWith('_one_cm'))return fmt(n/100000)+' km';if(['play_time','total_world_time','time_since_death','time_since_rest','sneak_time'].includes(short(id)))return fmt(n/72000)+' 小时';if(short(id).startsWith('damage_'))return fmt(n/10)+' 伤害点';return fmt(n)}
function drawTable(){let rows=[];const q=$('search').value.trim().toLowerCase();for(const [cat,items] of Object.entries(stats()))for(const [id,v] of Object.entries(items)){const label=cats[short(cat)]||short(cat);if((id+nice(id)+label).toLowerCase().includes(q))rows.push([label,id,v,short(cat)])}rows.sort((a,b)=>a[0].localeCompare(b[0],'zh')||b[2]-a[2]);const pages=Math.max(1,Math.ceil(rows.length/10));page=Math.min(page,pages-1);$('details').replaceChildren();for(const [cat,id,v,key] of rows.slice(page*10,page*10+10)){let tr=node('tr');tr.append(node('td',cat),node('td',nice(id)),node('td',amount(key,id,v)));$('details').append(tr)}$('pages').textContent=rows.length?rows.length+' 条 · '+(page+1)+' / '+pages:'暂无匹配记录';$('prev').disabled=page===0;$('next').disabled=page>=pages-1}
$('prev').onclick=()=>{page--;drawTable()};$('next').onclick=()=>{page++;drawTable()};$('search').oninput=()=>{page=0;drawTable()};$('category').onchange=render;$('importBtn').onclick=()=>$('files').click();
$('files').onchange=async e=>{try{let update={};for(const f of e.target.files){const j=JSON.parse(await f.text());if(j?.stats&&typeof j.stats==='object'&&Object.values(j.stats).every(v=>v&&typeof v==='object'&&Object.values(v).every(Number.isFinite)))update.stats=j.stats;else if(j&&Object.entries(j).some(([k,v])=>k.includes(':')&&typeof v?.done==='boolean'))update.advancements=j;else throw Error()}if(update.stats)data={labels:data.labels,...update};else data={...data,...update};page=0;render();$('status').textContent='本地文件已导入。'}catch{$('status').textContent='读取失败，请选择 Minecraft Java 版的统计或进度 JSON。'}finally{e.target.value=''}};render();
</script></body></html>
